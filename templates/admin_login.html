<!DOCTYPE html>
<html>
<head>
  <title>Admin Login | Lakshmi Jagadamba Bricks</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style_v2.css') }}">
</head>
<body>

<nav class="navbar">
  <div class="logo">🧱 Lakshmi Jagadamba Bricks</div>
</nav>

<div class="container">
  <h2>Admin Login</h2>

  {% if error %}
    <p style="color:red;">{{ error }}</p>
  {% endif %}

  <form method="post">
    <input type="password" name="password" placeholder="Enter admin password" required>
    <br><br>
    <button type="submit">Login</button>
  </form>
</div>

<footer>
  <p><strong>Lakshmi Jagadamba Bricks</strong></p>
  <p>Owners: K. S. R. Sai Krishna & K. Veerendra</p>
</footer>

</body>
</html>
